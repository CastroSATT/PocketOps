; LilyGO official sd_card sanity check (temporary)
[platformio]
boards_dir = ../../boards
default_envs = T-Dongle-S3

[env:T-Dongle-S3]
platform = espressif32@6.12.0
framework = arduino
board = dongles3
monitor_speed = 115200
monitor_filters = default, time
upload_speed = 921600
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=1
