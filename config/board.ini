; PocketOps board / GPIO / TFT — COMPILE TIME ONLY
; Edit this to port to another ESP32, then rebuild + upload firmware.
; Not copied to LittleFS (not runtime-editable).
;
; Build script: scripts/apply_board_config.py
;   → TFT_eSPI -D flags
;   → include/generated/BoardPins.h

; APA102 RGB LED
rgb_din=40
rgb_clk=39

; ST7735 LCD (SPI) — pins + panel
lcd_cs=4
lcd_mosi=3
lcd_sclk=5
lcd_dc=2
lcd_rst=1
lcd_bl=38
lcd_bl_on_level=0
tft_miso=-1
tft_width=80
tft_height=160
tft_rotation=1
; 0 = TFT_BGR (T-Dongle-S3 ST7735); 1 = TFT_RGB — wrong order makes sky-blue badges look orange
tft_rgb_order=0
tft_driver=ST7735
tft_tab=GREENTAB160x80
use_hspi=1
spi_frequency=27000000
load_glcd=1
load_font2=1
load_font4=1

; microSD (SDMMC)
sd_d0=14
sd_d1=17
sd_d2=21
sd_d3=18
sd_clk=12
sd_cmd=16

; Controls / expansion
boot_btn=0
qwiic_tx=43
qwiic_rx=44
