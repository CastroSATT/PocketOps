; PocketOps Mouse (LittleFS)
; If missing, firmware seeds this once, then always reads values from it.

; BT Serial HID mouse step (WASD in //mouse mode)
ble_serial_mouse_step=40

; Remote touchpad pointer speed (percent, 25–300; 100 = normal)
touchpad_speed=100

; Two-finger scroll speed (percent, 25–300; 100 = normal)
scroll_speed=100

; Two-finger drag scroll on the Remote touchpad (1=on, 0=off)
two_finger_scroll=1
