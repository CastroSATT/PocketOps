; PocketOps Display / device light (LittleFS)
; If missing, firmware seeds this once, then always reads values from it.

; TFT backlight brightness (percent · 5–100)
display_brightness=80

; Screen sleep after idle (seconds · 0 = never)
display_sleep_sec=0

; APA102 status LED brightness (percent · 5–100)
light_brightness=44
