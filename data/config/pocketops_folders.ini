; PocketOps SD card layout (LittleFS)
; key=value for naming — then one folder path per line (nested OK).
; If missing, firmware seeds this once, then always reads it.
;
; USB vendor / revision: include/Branding.h. USB product uses volume_label.

; FAT drive name after Format (max 11 chars) — also used as USB product name
volume_label=PocketOps

; NVS namespace (Expose-on-boot flag, etc.)
nvs_namespace=pocketops

; Folders created after Format (/Logs is required for device logs — not removable)
/Logs
/Mac
/PC
/Linux
/Audio
/Audio/Audio Tests
