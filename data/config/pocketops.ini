; PocketOps network / wireless (LittleFS)
; key=value — blank lines and ; comments ignored
; If missing, firmware seeds this once, then always reads values from it.
; Bluetooth: Config → Bluetooth (pocketops_bt.ini) + include/Branding.h

; Wi-Fi mode: ap (SoftAP only) | sta (join only) | apsta (SoftAP + join)
wifi_mode=ap

; Wi-Fi SoftAP (Remote HID hotspot)
wifi_ap_ssid=PocketOps
wifi_ap_pass=pocketops
wifi_ap_channel=1

; Last joined LAN (updated by Live Wi-Fi Connect on the web page)
wifi_sta_ssid=
wifi_sta_pass=

web_port=80
ws_port=81
