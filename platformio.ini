; PocketOps — LilyGO T-Dongle-S3
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = T-Dongle-S3
src_dir = src

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
monitor_filters =
	default
	esp32_exception_decoder
	time
upload_speed = 921600
board_build.filesystem = littlefs

[env:T-Dongle-S3]
board = dongles3
; TFT_eSPI pin/driver flags + BoardPins.h come from config/board.ini
extra_scripts =
	pre:scripts/apply_board_config.py
	pre:scripts/embed_www_seed.py
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	links2004/WebSockets@^2.4.1
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	; TinyUSB required for keyboard/mouse HID
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=0
	-DBOARD_T_DONGLE_S3=1

; If upload fails: hold BOOT while plugging in, then upload
; upload_port = /dev/cu.usbmodem*
