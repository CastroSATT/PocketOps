; PocketOps — LilyGO T-Dongle-S3
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = T-Dongle-S3
src_dir = src

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
monitor_filters =
	default
	esp32_exception_decoder
	time
upload_speed = 921600
board_build.filesystem = littlefs

[env:T-Dongle-S3]
board = dongles3
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	links2004/WebSockets@^2.4.1
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	; TinyUSB required for keyboard/mouse HID
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=0
	-DBOARD_T_DONGLE_S3=1
	; TFT_eSPI — LilyGO T-Dongle-S3
	; USE_HSPI_PORT required on ESP32-S3 or SPI register base is 0 → StoreProhibited
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7735_DRIVER=1
	-DST7735_GREENTAB160x80=1
	-DTFT_WIDTH=80
	-DTFT_HEIGHT=160
	-DTFT_RGB_ORDER=1
	-DTFT_MISO=-1
	-DTFT_MOSI=3
	-DTFT_SCLK=5
	-DTFT_CS=4
	-DTFT_DC=2
	-DTFT_RST=1
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DSPI_FREQUENCY=27000000
	-DDISABLE_ALL_LIBRARY_WARNINGS=1

; If upload fails: hold BOOT while plugging in, then upload
; upload_port = /dev/cu.usbmodem*
